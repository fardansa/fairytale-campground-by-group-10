<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fairytale Campground - Hasil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header class="warna-navbar">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a class="nav-link px-2" href="./index.html">Home</a></li>
                    <li><a class="nav-link px-2" href="./booking.html">Booking</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="container py-5">
        <h2 class="text-center mb-4">Hasil Pilihan Tenda Anda</h2>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Single Tent</h5>
                <ul id="hasilSingle" class="mb-4"></ul>

                <h5>Double Tent</h5>
                <ul id="hasilDouble" class="mb-4"></ul>

                <h5>Family Tent</h5>
                <ul id="hasilFamily"></ul>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="./order_summary.html" class="btn btn-secondary">Lanjut ke Order Summary</a>
        </div>
    </div>

    <script type="module">
        import { saveSelectedTents } from "./order_summary_flow.js";

        const raw = JSON.parse(localStorage.getItem("tendaDipilih")) || {
            single: [],
            double: [],
            family: []
        };

        function renderList(id, items) {
            const ul = document.getElementById(id);
            ul.innerHTML = "";
            if (items.length === 0) {
                ul.innerHTML = "<li class='text-muted'>-</li>";
            }
            items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                ul.appendChild(li);
            });
        }

        renderList("hasilSingle", raw.single);
        renderList("hasilDouble", raw.double);
        renderList("hasilFamily", raw.family);

        //Pake AI hehe ga paham js :(((( maafkan si dontol ini
        // KONVERSI DATA UNTUK ORDER SUMMARY
        // Mengubah ["Single Tent - 01"] menjadi ["Single Tent"] agar sesuai priceTable
        const combined = [
            ...raw.single.map(() => "Single Tent"),
            ...raw.double.map(() => "Double Tent"),
            ...raw.family.map(() => "Family Tent"),
        ];

        // Simpan ke localStorage agar order_summary.html bisa baca
        saveSelectedTents(combined);
        console.log("Data tenda disimpan:", combined);
    </script>

</body>

</html>
