<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Tanggal Camping</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
        body {
            background-color: #f4f8f3;
        }
        .card {
            background-color: #ffffff;
            border: 2px solid #1d4807;
        }

        .page-bg {
        background-image: url("./foto/pickdate.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 2px solid #1d4807;
        }

        /* === FLATPICKR stylr === */
        .flatpickr-calendar {
            border: 2px solid #1d4807;
            border-radius: 12px;
            background: #ffffff;
        }

        .flatpickr-months .flatpickr-month {
            background: #1d4807;
            color: white;
        }

        .flatpickr-weekdays {
            background: #d9f2d0;
            color: white;
        }

        .flatpickr-day.today {
            background: #d9f2d0;
            border-color: #1d4807;
        }

        .flatpickr-day.selected {
            background: #1d4807 !important;
            border-color: #1d4807 !important;
            color: white;
        }

        .flatpickr-day:hover {
            background: #1d4807;
            color: white;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.flatpickr-disabled:hover {
            color: #ccc;
            cursor: not-allowed;
        }

        .navbar-custom {
        width: 100%;
        background-color: #1d4807;
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        padding: 14px 0;
        z-index: 999;
        box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        }

        /* INNER CONTAINER */
        .navbar-container {
        max-width: 1280px;
        margin: auto;
        padding: 0 24px;

        display: flex;
        justify-content: space-between;
        align-items: center;
        }

        .navbar-logo {
        font-size: 26px;
        font-weight: 700;
        color: white;
        text-decoration: none;
        }

        .navbar-menu {
        list-style: none;
        display: flex;
        gap: 32px;
        margin: 0;
        padding: 0;
        }

        .navbar-menu a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        transition: 0.2s;
        }

        .navbar-menu a:hover {
        color: #bbf7d0;
        }

        .navbar-auth {
        display: flex;
        gap: 16px;
        }

        .btn-outline {
        padding: 8px 16px;
        border: 2px solid white;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
        }

        .btn-outline:hover {
        background-color: white;
        color: #1d4807;
        }

        .btn-solid {
        padding: 8px 16px;
        background-color: white;
        color: #1d4807;
        font-weight: 600;
        text-decoration: none;
        border-radius: 10px;
        transition: 0.2s;
        }

        .btn-solid:hover {
        background-color: #bbf7d0;
        }

</style>
</head>

<body class="min-h-screen page-bg">
    <header class="navbar-custom">
        <div class="navbar-container">

            <a href="./index.html" class="navbar-logo">Fairytale Campground</a>

            <nav>
            <ul class="navbar-menu">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./pickdate.html">Booking</a></li>
                <li><a href="./contact_us.html">Contact Us</a></li>
            </ul>
            </nav>

            <div class="navbar-auth">
            <a href="./registrasi.html" class="btn-outline">Registrasi</a>
            <a href="./login.html" class="btn-solid">Login</a>
            </div>
        </div>
    </header>


<div class="flex justify-center items-center min-h-screen px-6">
    <div class="card p-8 rounded-2xl shadow-xl w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-[white] mb-6">
            Pilih Tanggal Camping
        </h1>

        <form id="dateForm" class="space-y-5">

            <div>
                <label class="text-sm font-semibold text-[white]">Tanggal Check-In</label>
                <input type="text"
                       id="checkin"
                       class="w-full mt-1 p-3 rounded-lg border border-[#1d4807] focus:ring-2 focus:ring-[#225909]"
                       placeholder="Pilih tanggal"
                       required>
            </div>

            <div>
                <label class="text-sm font-semibold text-[white]">Tanggal Check-Out</label>
                <input type="text"
                       id="checkout"
                       class="w-full mt-1 p-3 rounded-lg border border-[#1d4807] focus:ring-2 focus:ring-[#225909]"
                       placeholder="Pilih tanggal"
                       required>
            </div>

            <button type="submit"
                    class="w-full bg-[#1d4807] hover:bg-[#225909] text-white font-semibold p-3 rounded-xl transition shadow-lg">
                Lihat paket dan tenda yang tersedia
            </button>
        </form>
    </div>
</div>

<div id="popupWarning"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white border-2 border-[#1d4807] rounded-xl p-6 w-80 shadow-xl text-center">
        <h2 class="text-lg font-bold text-[#1d4807] mb-3">Tanggal Belum Lengkap</h2>
        <p class="text-gray-700 mb-4">Silakan pilih tanggal Check-In dan Check-Out.</p>
        <button onclick="closePopup()"
                class="px-5 py-2 bg-[#1d4807] text-white rounded-lg hover:bg-[#225909]">
            Mengerti
        </button>
    </div>
</div>

<script>
    const checkIn = flatpickr("#checkin", {
        minDate: "today",
        dateFormat: "Y-m-d",
        onChange: function(selectedDates) {
            if (selectedDates.length > 0) {
                const chosenDate = selectedDates[0].toISOString().split('T')[0];
                localStorage.setItem("checkin_date", chosenDate);

                const minCheckout = new Date(selectedDates[0]);
                minCheckout.setDate(minCheckout.getDate() + 1);
                
                checkOut.set("minDate", minCheckout);
                checkOut.setDate("");
            }
        }
    });

    const checkOut = flatpickr("#checkout", {
        dateFormat: "Y-m-d",
        onChange: function(selectedDates) {
            if (selectedDates.length > 0) {
                const chosenDate = selectedDates[0].toISOString().split('T')[0];
                localStorage.setItem("checkout_date", chosenDate);
            }
        }
    });

    window.addEventListener("DOMContentLoaded", () => {
        const savedCheckin = localStorage.getItem("checkin_date");
        const savedCheckout = localStorage.getItem("checkout_date");

        if (savedCheckin) {
            checkIn.setDate(savedCheckin);
            const minCheckout = new Date(savedCheckin);
            minCheckout.setDate(minCheckout.getDate() + 1);
            checkOut.set("minDate", minCheckout);
        }

        if (savedCheckout) {
            checkOut.setDate(savedCheckout);
        }
    });

    function showPopup() {
        document.getElementById("popupWarning").classList.remove("hidden");
    }

    function closePopup() {
        document.getElementById("popupWarning").classList.add("hidden");
    }

    document.getElementById("dateForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const checkinValue = checkIn.input.value;
        const checkoutValue = checkOut.input.value;

        if (!checkinValue || !checkoutValue) {
            showPopup();
            return;
        }

        localStorage.setItem("checkin_date", checkinValue);
        localStorage.setItem("checkout_date", checkoutValue);

        window.location.href = "./paket.html";
    });
</script>



</body>
</html>
