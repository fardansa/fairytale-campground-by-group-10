<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fairytale Campground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header class="warna-navbar">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                </a>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li>
                        <a class="nav-link px-2" href="./index.html">Home</a>
                    </li>
                    <li>
                        <a class="nav-link px-2" href="./booking.html">Booking</a>
                    </li>
                    <li>
                        <a class="nav-link px-2" href="./contact_us.html">Contact Us</a>
                    </li>
                </ul>

                <div class="text-end">
                    <a href="./registrasi.html" class="btn btn-outline-light me-2">Registrasi</a>
                    <a href="./login.html" class="btn btn-light me-2">Login</a>
                </div>
            </div>
        </div>
    </header>

    <!-- FORM CENTERED -->
    <!-- FORM CENTERED -->
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <form class="row g-3 shadow p-4 rounded bg-white" style="width: 600px;">
    
            <div class="col-md-6">
                <label for="inputNama" class="form-label">Nama</label>
                <input type="text" class="form-control" id="inputNama" placeholder="Masukkan nama lengkap">
            </div>

            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail4" placeholder="email@gmail.com">
            </div>

            <div class="col-12">
                <label for="inputPassword4" class="form-label">Password</label>
                <input type="password" class="form-control" id="inputPassword4" placeholder="Buat password">
            </div>

            <div class="col-12">
                <label for="inputConfirmPassword" class="form-label">Konfirmasi Password</label>
                <input type="password" class="form-control" id="inputConfirmPassword" placeholder="Ulangi password">
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Check me out
                    </label>
                </div>
            </div>
    
            <div class="col-12 text-center">
                <a href="./berhasil_registrasi.html" class="btn btn-success px-5">
                Daftarkan Saya
                </a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const raw = location.pathname.split("/").pop();
    const currentPath = raw === "" ? "index.html" : raw;

    document.querySelectorAll(".nav-link").forEach(link => {
        const href = link.getAttribute("href");
        const linkFile = href.split("/").pop().replace(/^\.\/+/, "");

        if (linkFile === currentPath) {
            link.classList.add("active");
        } else {
            link.classList.remove("active");
        }
    });
</script>

</body>
</html>
