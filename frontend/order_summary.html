<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fairytale Campground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Fairytale Campground</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>

        <header class="warna-navbar">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                        <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                            <use xlink:href="#bootstrap"></use>
                        </svg>
                    </a>
                    <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                        <li>
                            <a class="nav-link px-2" href="./index.html">Home</a>
                        </li>
                        <li>
                            <a class="nav-link px-2" href="./booking.html">Booking</a>
                        </li>
                        <li>
                            <a class="nav-link px-2" href="./contact_us.html">Contact Us</a>
                        </li>
                    </ul>

                    <div class="text-end">
                        <a href="./registrasi.html" class="btn btn-outline-light me-2">Registrasi</a>
                        <a href="./login.html" class="btn btn-light me-2">Login</a>
                    </div>
                </div>
            </div>
        </header>

    <div class="container py-4">
        <h2 class="mb-4 text-center fw-semibold">Order Summary Anda</h2>

        <div class="row g-4">
            <div class="col-lg-7">
                <div id="ticketContainer">
                </div>
            </div>

            <div class="col-lg-5">
                <div id="priceCard" class="card p-4 shadow-sm" style="background-color: #fff;">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { generateOrderSummary } from "./order_summary_flow.js";

        const summary = generateOrderSummary();
        const container = document.getElementById("ticketContainer");
        const priceContainer = document.getElementById("priceCard");

        // 1. RENDER TICKET CARDS (KIRI)
        if (summary.items.length === 0) {
            container.innerHTML = `<div class="alert alert-warning">Belum ada tenda yang dipilih. Silakan kembali ke menu Booking.</div>`;
        } else {
            // Loop semua item, bukan cuma yang pertama
            const cardsHTML = summary.items.map(item => `
                <div class="card mb-3 p-3 shadow-sm">
                    <div class="d-flex align-items-start gap-3">
                        <div style="width: 120px; height: 90px; background: #e9ecef; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
                            <small class="text-muted">Img</small>
                        </div>
                        
                        <div class="flex-grow-1">
                            <h5 class="mb-1 fw-bold">${item.tentType}</h5>
                            <span class="badge bg-secondary mb-2">Tenda #${item.tentNumber}</span>
                            
                            <hr class="my-2">

                            <div class="row text-small" style="font-size: 0.9rem;">
                                <div class="col-6">
                                    <span class="text-muted">Check-in:</span><br>
                                    <strong>${summary.checkIn}</strong>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="text-muted">Check-out:</span><br>
                                    <strong>${summary.checkOut}</strong>
                                </div>
                            </div>
                            <div class="mt-2 text-end text-success fw-bold">
                                ${item.nights} Malam
                            </div>
                        </div>
                    </div>
                </div>
            `).join("");

            container.innerHTML = cardsHTML;
        }

        // 2. RENDER PRICE SUMMARY (KANAN)
        priceContainer.innerHTML = `
            <h5 class="fw-semibold mb-3">Ringkasan Harga</h5>
            
            ${summary.items.map(i => `
                <div class="d-flex justify-content-between mb-2">
                    <span>${i.tentType} (x${i.nights} malam)</span>
                    <span>Rp ${i.subtotal.toLocaleString('id-ID')}</span>
                </div>
            `).join("")}
            
            <hr>
            
            <div class="d-flex justify-content-between mb-3">
                <span class="fw-bold">Total Pembayaran</span>
                <span class="fw-bold text-success fs-5">Rp ${summary.total.toLocaleString('id-ID')}</span>
            </div>
            
            <button class="btn btn-success w-100 py-2 fw-bold">COMING SOON [Tombol Pembayaran]</button>
        `;
    </script>

</body>

</html>
