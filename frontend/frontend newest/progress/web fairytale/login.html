<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fairytale Campground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header class="navbar-custom">
          <div class="navbar-container">

              <a href="./index.html" class="navbar-logo">Fairytale Campground</a>

              <nav>
              <ul class="navbar-menu">
                  <li><a href="./index.html">Home</a></li>
                  <li><a href="./pickdate.html">Booking</a></li>
                  <li><a href="./contact_us.html">Contact Us</a></li>
              </ul>
              </nav>

              <div class="navbar-auth">
              <a href="./registrasi.html" class="btn-outline">Registrasi</a>
              <a href="./login.html" class="btn-solid">Login</a>
              </div>
          </div>
      </header>

    <div class="d-flex align-items-center justify-content-center" style="min-height: 85vh; margin-top: 50px;">
        <main class="form-signin w-100" style="max-width: 380px;">
            <form>

                <h1 class="h3 mb-3 fw-normal text-center">Login</h1>

                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="inputName" placeholder="Nama Anda">
                    <label for="inputName">Nama Anda</label>
                </div>

                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com">
                    <label for="inputEmail">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="inputPassword" placeholder="Password">
                    <label for="inputPassword">Password</label>
                </div>

                <div class="form-check text-start mb-3">
                    <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">Remember me</label>
                </div>

                <button type="submit" class="w-100 btn btn-lg btn-success">
                    Login
                </button>


                <p class="mt-5 mb-3 text-body-secondary text-center">© Fairytale Campground Gacorrr</p>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const raw = location.pathname.split("/").pop();
    const currentPath = raw === "" ? "index.html" : raw;

    document.querySelectorAll(".nav-link").forEach(link => {
        const href = link.getAttribute("href");
        const linkFile = href.split("/").pop().replace(/^\.\/+/, "");

        if (linkFile === currentPath) {
            link.classList.add("active");
        } else {
            link.classList.remove("active");
        }
    });
</script>

<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault(); // Biar tidak reload halaman default

        const email = document.getElementById("inputEmail").value.trim();
        const password = document.getElementById("inputPassword").value.trim();

        // ===============================
        // Cek Login ADMIN
        // ===============================
        if (email === "admin@fairytale.com" && password === "admin123") {
            window.location.href = "./admin_dashboard.html";
            return;
        }

        // ===============================
        // Jika bukan admin → login user biasa
        // ===============================
        window.location.href = "./berhasil_login.html";
    });
</script>



</body>

</html>
