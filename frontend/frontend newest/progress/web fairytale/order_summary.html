<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fairytale Campground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">

<body>

    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Fairytale Campground</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>

<header class="navbar-custom">
          <div class="navbar-container">

              <a href="./index.html" class="navbar-logo">Fairytale Campground</a>

              <nav>
              <ul class="navbar-menu">
                  <li><a href="./index.html">Home</a></li>
                  <li><a href="./pickdate.html">Booking</a></li>
                  <li><a href="./contact_us.html">Contact Us</a></li>
              </ul>
              </nav>

              <div class="navbar-auth">
              <a href="./registrasi.html" class="btn-outline">Registrasi</a>
              <a href="./login.html" class="btn-solid">Login</a>
              </div>
          </div>
      </header>

<a href="javascript:history.back()" class="btn-back">← Kembali</a>

    <div class="container py-4">
        <h2 class="mb-4 text-center fw-semibold">Order Summary Anda</h2>

        <div class="row g-4">
            <div class="col-lg-7">
                <div id="ticketContainer">
                </div>
            </div>

            <div class="col-lg-5">
                <div id="priceCard" class="card p-4 shadow-sm" style="background-color: #fff;">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { generateOrderSummary } from "./order_summary_flow.js";

        const summary = generateOrderSummary();

        // Mapping tipe tenda → path gambar
            const tentImages = {
                "Single Tent": "./foto/tenda1.png",
                "Double Tent": "./foto/tenda2.png",
                "Family Tent": "./foto/tenda3.png",

                // fallback jika tidak ditemukan
                "default": "./assets/tents/default.png"
            };


        const container = document.getElementById("ticketContainer");
        const priceContainer = document.getElementById("priceCard");

        // 1. RENDER TICKET CARDS (KIRI)
        if (summary.items.length === 0) {
            container.innerHTML = `<div class="alert alert-warning">Belum ada tenda yang dipilih. Silakan kembali ke menu Booking.</div>`;
        } else {
            // Loop semua item, bukan cuma yang pertama
            const cardsHTML = summary.items.map(item => {
                const imgSrc = tentImages[item.tentType] || tentImages["default"];

                return `
        <div class="card mb-3 p-3 shadow-sm">
            <div class="d-flex align-items-start gap-3">

                <!-- IMAGE HERE -->
                <img src="${imgSrc}" 
                    alt="${item.tentType}" 
                    style="width: 120px; height: 90px; object-fit: cover; border-radius: 4px;">

                <div class="flex-grow-1">
                    <h5 class="mb-1 fw-bold">${item.tentType}</h5>
                    <span class="badge bg-secondary mb-2">Tenda #${item.tentNumber}</span>

                    <hr class="my-2">

                    <div class="row text-small" style="font-size: 0.9rem;">
                        <div class="col-6">
                            <span class="text-muted">Check-in:</span><br>
                            <strong>${summary.checkIn}</strong>
                        </div>
                        <div class="col-6 text-end">
                            <span class="text-muted">Check-out:</span><br>
                            <strong>${summary.checkOut}</strong>
                        </div>
                    </div>
                    <div class="mt-2 text-end text-success fw-bold">
                        ${item.nights} Malam
                    </div>
                </div>
            </div>
        </div>
    `;
            }).join("");


            container.innerHTML = cardsHTML;
        }

        // 2. RENDER PRICE SUMMARY (KANAN)
        priceContainer.innerHTML = `
            <h5 class="fw-semibold mb-3">Ringkasan Harga</h5>
            
            ${summary.items.map(i => `
                <div class="d-flex justify-content-between mb-2">
                    <span>${i.tentType} (x${i.nights} malam)</span>
                    <span>Rp ${i.subtotal.toLocaleString('id-ID')}</span>
                </div>
            `).join("")}
            
            <hr>
            
            <div class="d-flex justify-content-between mb-3">
                <span class="fw-bold">Total Pembayaran</span>
                <span class="fw-bold text-success fs-5">Rp ${summary.total.toLocaleString('id-ID')}</span>
            </div>
            
            <a href="./payment.html" class="btn btn-success w-100 py-2 fw-bold">
                Bayar
            </a>

        `;
    </script>

</body>

</html>
